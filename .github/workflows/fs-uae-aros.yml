name: FS-UAE AROS qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aros-runtime-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full

      - name: Static checks
        run: make check

      - name: PBMP Endpoint M0 adapter smoke test
        run: make check-pbmp

      - name: Network runtime snapshot regression
        run: make check-runtime

      - name: PBMP Endpoint M0 conformance
        shell: bash
        run: |
          set -euo pipefail
          PBMP_REV=b8c9ff18fca516a118a7a45001860e5de9c95da3
          git clone https://github.com/Ploos-AS/PBMP.git build/pbmp-suite
          git -C build/pbmp-suite checkout "$PBMP_REV"
          cc -std=c99 -Wall -Wextra -Werror -Iinclude tests/pbmp_driver.c src/pbmp.c src/network_runtime.c -o build/tests/pbmp_driver
          python3 ci/pbmp_bridge.py --socket /tmp/ambnc-pbmp.sock --driver "$PWD/build/tests/pbmp_driver" --requests 3 &
          bridge_pid=$!
          for i in {1..50}; do
            [ -S /tmp/ambnc-pbmp.sock ] && break
            sleep 0.1
          done
          python3 build/pbmp-suite/tools/qualify_endpoint.py \
            --profile endpoint-m0 \
            --socket /tmp/ambnc-pbmp.sock \
            --implementation-name AmBNC \
            --implementation-version 0.7.0-m7 \
            --output build/pbmp-conformance-report.json
          wait "$bridge_pid"
          test "$(python3 -c 'import json; print(json.load(open("build/pbmp-conformance-report.json"))["result"])')" = pass

      - name: Gate 1 - native Bebbo AmBNC build
        run: bash ci/fs-uae/build-native.sh

      - name: Gate 2 - execute AmBNC inside AROS guest
        run: bash ci/fs-uae/run-aros-guest-smoke.sh

      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-uae-aros-qualification
          path: |
            build/pbmp-conformance-report.json
            build/fs-uae/native/AmBNC
            build/fs-uae/native/AmBNC.sha256
            build/fs-uae/native/file.txt
            build/fs-uae/native/result.txt
            build/fs-uae/native/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-guest/result.txt
            build/fs-uae/aros-guest/fs-uae.log
            build/fs-uae/aros-guest/fs-uae-version.txt
            build/fs-uae/aros-guest/aros-guest.fs-uae
          if-no-files-found: warn
